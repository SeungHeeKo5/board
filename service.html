<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지역별 여행지 카드북</title>
  <style>
    :root {
      --primary-color: #3b82f6;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      padding: 24px 16px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .select-box {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
    }

    select {
      padding: 10px 16px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      background-color: #fff;
      cursor: pointer;
    }

    .status-badge {
      font-size: 0.875rem;
      color: #64748b;
      margin-top: 8px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #e2e8f0;
    }

    .card-content {
      padding: 16px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #0f172a;
    }

    .card-addr {
      font-size: 0.875rem;
      color: #64748b;
    }

    .empty-state {
      display: none;
      text-align: center;
      padding: 48px 0;
      color: #94a3b8;
    }

    .spinner {
      display: none;
      text-align: center;
      padding: 32px 0;
      font-weight: 600;
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🗺️ 지역별 여행지 카드북</h1>
      <div class="select-box">
        <label for="areaCodeSelect">지역 선택:</label>
        <select id="areaCodeSelect">
          <option value="">-- 지역을 선택하세요 --</option>
          <option value="1">서울</option>
          <option value="2">인천</option>
          <option value="3">대전</option>
          <option value="4">대구</option>
          <option value="5">광주</option>
          <option value="6">부산</option>
          <option value="7">울산</option>
          <option value="8">세종</option>
          <option value="31">경기</option>
          <option value="32">강원</option>
          <option value="39">제주</option>
        </select>
      </div>
      <div class="status-badge" id="statusBadge"></div>
    </header>

    <main>
      <div id="loading" class="spinner">데이터를 불러오는 중입니다...</div>
      <div id="cardGrid" class="card-grid"></div>
    </main>
  </div>

  <!-- Firebase SDK (Modular v9/v10 via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. Firebase 설정 (본인의 Firebase 프로젝트 설정 값으로 교체)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 2. 공공데이터포털 API 설정 (서비스키 발급 필요)
    const TOUR_API_KEY = "YOUR_PUBLIC_DATA_SERVICE_KEY"; 
    const TOUR_API_URL = "https://apis.data.go.kr/B551011/KorService1/areaBasedList1";

    // DOM 요소 참조
    const areaSelect = document.getElementById("areaCodeSelect");
    const cardGrid = document.getElementById("cardGrid");
    const loading = document.getElementById("loading");
    const statusBadge = document.getElementById("statusBadge");

    // 앱 초기화 실행
    document.addEventListener("DOMContentLoaded", initApp);
    areaSelect.addEventListener("change", handleAreaChange);

    // 페이지 로드 시 Firebase에서 마지막 저장된 지역 정보 조회
    async function initApp() {
      try {
        const snapshot = await get(ref(db, "userSelection/latest"));
        if (snapshot.exists()) {
          const savedData = snapshot.val();
          areaSelect.value = savedData.areaCode;
          statusBadge.textContent = `최근에 선택된 지역 [${savedData.areaName}]의 데이터를 복원했습니다.`;
          renderCards(savedData.items);
        } else {
          // 저장된 데이터가 없는 경우 뷰를 비워둔 상태 유지
          cardGrid.innerHTML = "";
          statusBadge.textContent = "선택된 지역이 없습니다. 지역을 선택해주세요.";
        }
      } catch (error) {
        console.error("Firebase 초기 데이터 로드 실패:", error);
      }
    }

    // 사용자가 지역 변경 시 동작
    async function handleAreaChange(e) {
      const areaCode = e.target.value;
      const areaName = e.target.options[e.target.selectedIndex].text;

      if (!areaCode) {
        cardGrid.innerHTML = "";
        statusBadge.textContent = "";
        return;
      }

      showLoading(true);

      try {
        // 1. 공공데이터 API 호출
        const items = await fetchTourData(areaCode);

        // 2. Firebase Realtime Database 저장 (계속 업데이트)
        await saveToFirebase(areaCode, areaName, items);

        // 3. UI 시각화 뷰 출력
        renderCards(items);
        statusBadge.textContent = `현재 선택: ${areaName} (Firebase 저장 완료)`;
      } catch (error) {
        console.error("데이터 처리 오류:", error);
        alert("데이터를 가져오는 중 오류가 발생했습니다.");
      } finally {
        showLoading(false);
      }
    }

    // 공공데이터 API Fetch 함수
    async function fetchTourData(areaCode) {
      const queryParams = new URLSearchParams({
        serviceKey: TOUR_API_KEY,
        numOfRows: '12',
        pageNo: '1',
        MobileOS: 'ETC',
        MobileApp: 'AppTest',
        _type: 'json',
        areaCode: areaCode,
        arrange: 'Q' // 대표이미지가 있는 정렬
      });

      const response = await fetch(`${TOUR_API_URL}?${queryParams.toString()}`);
      const data = await response.json();

      const items = data.response?.body?.items?.item || [];
      return items;
    }

    // Firebase 데이터 업데이트 함수
    async function saveToFirebase(areaCode, areaName, items) {
      await set(ref(db, "userSelection/latest"), {
        areaCode: areaCode,
        areaName: areaName,
        updatedAt: new Date().toISOString(),
        items: items
      });
    }

    // 카드 목록 UI 렌더링 함수
    function renderCards(items) {
      cardGrid.innerHTML = "";

      if (!items || items.length === 0) {
        cardGrid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding: 40px; color: #94a3b8;">해당 지역의 관광지 정보가 없습니다.</p>`;
        return;
      }

      items.forEach(item => {
        const imageSrc = item.firstimage || item.firstimage2 || "https://via.placeholder.com/300x180?text=No+Image";
        const title = item.title || "관광지명 정보 없음";
        const addr = item.addr1 || item.addr2 || "주소 정보 없음";

        const cardElement = document.createElement("div");
        cardElement.className = "card";
        cardElement.innerHTML = `
          <img src="${imageSrc}" alt="${title}" loading="lazy" />
          <div class="card-content">
            <h3 class="card-title">${title}</h3>
            <p class="card-addr">${addr}</p>
          </div>
        `;
        cardGrid.appendChild(cardElement);
      });
    }

    function showLoading(isLoading) {
      loading.style.display = isLoading ? "block" : "none";
      if (isLoading) cardGrid.style.opacity = "0.3";
      else cardGrid.style.opacity = "1";
    }
  </script>
</body>
</html>
