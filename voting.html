<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 투표/설문조사</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .poll-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
    }
    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }
    .options {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    .btn-vote {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #4a90e2;
      color: white;
      transition: background 0.2s;
    }
    .btn-vote:hover {
      background-color: #357abd;
    }
    .btn-vote:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .chart-item {
      margin-bottom: 15px;
    }
    .chart-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 5px;
      color: #555;
    }
    .bar-background {
      background-color: #e9ecef;
      border-radius: 6px;
      height: 24px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background-color: #4abc96;
      border-radius: 6px;
      transition: width 0.4s ease-in-out;
    }
    .total-votes {
      text-align: right;
      font-size: 13px;
      color: #888;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="poll-container">
    <h2>선호하는 옵션을 선택하세요</h2>
    
    <div class="options">
      <button class="btn-vote" onclick="castVote('optionA')">A안 투표</button>
      <button class="btn-vote" onclick="castVote('optionB')">B안 투표</button>
    </div>

    <div id="chart-section">
      <div class="chart-item">
        <div class="chart-label">
          <span>A안</span>
          <span id="label-optionA">0표 (0%)</span>
        </div>
        <div class="bar-background">
          <div id="bar-optionA" class="bar-fill"></div>
        </div>
      </div>

      <div class="chart-item">
        <div class="chart-label">
          <span>B안</span>
          <span id="label-optionB">0표 (0%)</span>
        </div>
        <div class="bar-background">
          <div id="bar-optionB" class="bar-fill" style="background-color: #f39c12;"></div>
        </div>
      </div>
    </div>

    <div class="total-votes" id="total-count">총 투표 수: 0표</div>
  </div>

  <script>
    // 배포한 GAS 웹 앱 URL 입력
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzvhlb3svXn_3Z-Whx-7Z0bNjPLxga38dwHnh4JZeRTmXL0U5RlE5mR_8WTZ8MCsqKWjQ/exec";

    // 1. 초기 득표 현황 가져오기 (GET)
    async function fetchResults() {
      try {
        const response = await fetch(GAS_WEB_APP_URL);
        const result = await response.json();
        if (result.status === "success") {
          updateChart(result.data);
        }
      } catch (err) {
        console.error("데이터 로드 실패:", err);
      }
    }

    // 2. 투표하기 (POST)
    async function castVote(optionKey) {
      setButtonsEnabled(false);

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8" // GAS CORS 이슈 방지용 설정
          },
          body: JSON.stringify({ option: optionKey })
        });
        
        const result = await response.json();
        if (result.status === "success") {
          updateChart(result.data);
        } else {
          alert("투표 처리 중 오류가 발생했습니다.");
        }
      } catch (err) {
        console.error("투표 실패:", err);
      } finally {
        setButtonsEnabled(true);
      }
    }

    // 3. CSS 바 차트 및 텍스트 갱신
    function updateChart(data) {
      const countA = data.optionA || 0;
      const countB = data.optionB || 0;
      const total = countA + countB;

      const percentA = total > 0 ? ((countA / total) * 100).toFixed(1) : 0;
      const percentB = total > 0 ? ((countB / total) * 100).toFixed(1) : 0;

      // DOM 업데이트
      document.getElementById("bar-optionA").style.width = percentA + "%";
      document.getElementById("label-optionA").innerText = `${countA}표 (${percentA}%)`;

      document.getElementById("bar-optionB").style.width = percentB + "%";
      document.getElementById("label-optionB").innerText = `${countB}표 (${percentB}%)`;

      document.getElementById("total-count").innerText = `총 투표 수: ${total}표`;
    }

    function setButtonsEnabled(enabled) {
      document.querySelectorAll(".btn-vote").forEach(btn => btn.disabled = !enabled);
    }

    // 페이지 로드 시 현황 조회
    window.onload = fetchResults;
  </script>
</body>
</html>
