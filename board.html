<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 방명록</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; color: #333; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { font-size: 1.5rem; margin-bottom: 20px; color: #111; text-align: center; }
    
    form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; outline: none; transition: border 0.2s; }
    input:focus, textarea:focus { border-color: #4A90E2; }
    textarea { resize: vertical; height: 90px; }
    
    button { padding: 12px; background: #4A90E2; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #357ABD; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    
    .guestbook-list { display: flex; flex-direction: column; gap: 12px; }
    .card { background: #fafafa; border: 1px solid #eee; padding: 14px 16px; border-radius: 8px; }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; color: #777; }
    .card-author { font-weight: bold; color: #222; font-size: 0.95rem; }
    .card-message { font-size: 0.95rem; line-height: 1.4; white-space: pre-wrap; word-break: break-all; }
    
    .loading { text-align: center; color: #888; font-size: 0.9rem; padding: 10px 0; }
  </style>
</head>
<body>

<div class="container">
  <h1>📖 실시간 방명록</h1>
  
  <form id="guestbook-form">
    <input type="text" id="author" placeholder="작성자 이름" required maxlength="20">
    <textarea id="message" placeholder="남길 메시지를 적어주세요..." required maxlength="300"></textarea>
    <button type="submit" id="submit-btn">작성하기</button>
  </form>

  <div id="loading" class="loading">방명록을 불러오는 중...</div>
  <div id="guestbook-list" class="guestbook-list"></div>
</div>

<script>
  // 배포한 Google Apps Script 웹 앱 URL
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzGPwHeRjuiD0xB-f0WwiIUZF6bfiMzPFAKDGzWj86IlZe7E8n9xJbCkPJwzPCJiCVz/exec";

  const form = document.getElementById('guestbook-form');
  const submitBtn = document.getElementById('submit-btn');
  const listContainer = document.getElementById('guestbook-list');
  const loadingEl = document.getElementById('loading');

  // 방명록 목록 불러오기
  async function fetchMessages() {
    try {
      const res = await fetch(GAS_WEB_APP_URL);
      const data = await res.json();
      renderMessages(data);
    } catch (err) {
      console.error("데이터 로드 실패:", err);
      loadingEl.textContent = "방명록을 불러오는 데 실패했습니다.";
    } finally {
      loadingEl.style.display = "none";
    }
  }

  // 화면 리더링
  function renderMessages(items) {
    listContainer.innerHTML = '';
    if (items.length === 0) {
      listContainer.innerHTML = '<div class="loading">아직 작성된 방명록이 없습니다.</div>';
      return;
    }
    
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">
          <span class="card-author">${escapeHtml(item.name)}</span>
          <span>${item.createdAt}</span>
        </div>
        <div class="card-message">${escapeHtml(item.message)}</div>
      `;
      listContainer.appendChild(card);
    });
  }

  // 방명록 등록 (POST)
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const name = document.getElementById('author').value.trim();
    const message = document.getElementById('message').value.trim();
    
    if (!name || !message) return;

    submitBtn.disabled = true;
    submitBtn.textContent = '저장 중...';

    try {
      await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ name, message })
      });

      document.getElementById('message').value = '';
      await fetchMessages(); // 목록 새로고침
    } catch (err) {
      alert('방명록 작성에 실패했습니다.');
      console.error(err);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '작성하기';
    }
  });

  // XSS 방지 처리 (정상적인 HTML 엔티티 코드로 수정됨)
  function escapeHtml(text) {
    return text
      .replace(/&/g, "&")
      .replace(/</g, "<")
      .replace(/>/g, ">")
      .replace(/"/g, """)
      .replace(/'/g, "'");
  }

  // 초기 로드
  fetchMessages();
</script>

</body>
</html>
